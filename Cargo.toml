# --- Package manager ---
apk = ["alloc"]    # Alpine Package Keeper (APK) package manager

[dependencies]
# Core dependency - provides syscall interface
libc = "0.2"

[dev-dependencies]
# For testing only - benchmarks are in crates/benchmarks
tempfile = "3"

# Benchmark profile
[profile.bench]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = false

# Don't use panic=abort for dev profile to allow tests
[profile.dev]
panic = "unwind"

# Test profile needs unwind for test harness
[profile.test]
panic = "unwind"

[[bin]]
name = "armybox"
path = "src/main.rs"
test = false  # Binary uses no_std/no_main, can't be tested directly
