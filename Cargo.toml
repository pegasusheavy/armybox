[package]
name = "armybox"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Pegasus Heavy Industries <contact@pegasusheavy.industries>"]
description = "A memory-safe #[no_std] BusyBox/Toybox clone in Rust - 299 Unix utilities in ~500KB"
documentation = "https://docs.rs/armybox"
readme = "README.md"
homepage = "https://pegasusheavy.github.io/armybox"
repository = "https://github.com/pegasusheavy/armybox"
license = "MIT OR Apache-2.0"
keywords = ["busybox", "toybox", "no_std", "embedded", "unix"]
categories = ["command-line-utilities", "no-std", "embedded"]
exclude = ["docs/", "dist/", "fuzz/", "packaging/", "scripts/", ".github/", "target/", "benches/", "crates/"]

[features]
default = ["alloc", "full"]
alloc = []          # Enable heap allocation (Vec, String, Box)
std = ["alloc"]     # Enable std (for easier testing, not required)
android = ["alloc"] # Android/Bionic-specific compatibility

# =============================================================================
# Applet Meta-Features
# =============================================================================

# All applets enabled (default)
full = [
    # File utilities
    "basename", "cat", "cd", "chattr", "chgrp", "chmod", "chown", "cp", "dd",
    "dirname", "file", "find", "fstype", "install", "link", "ln", "ls", "lsattr",
    "makedevs", "mkdir", "mkfifo", "mknod", "mktemp", "mv", "patch", "pwd",
    "readlink", "realpath", "rm", "rmdir", "setfattr", "shred", "split", "stat",
    "sync", "touch", "truncate", "unlink", "xargs",
    # Text utilities
    "awk", "comm", "cut", "dos2unix", "echo", "expand", "fmt", "fold", "grep",
    "head", "nl", "paste", "printf", "rev", "sed", "seq", "sort", "strings",
    "tac", "tail", "tee", "tr", "unexpand", "uniq", "unix2dos", "wc", "yes",
    # System utilities
    "acpi", "arch", "blkdiscard", "blkid", "blockdev", "cal", "chroot", "chvt",
    "date", "deallocvt", "devmem", "df", "dmesg", "dnsdomainname", "du", "eject",
    "env", "fallocate", "fgconsole", "flock", "free", "freeramdisk", "fsfreeze",
    "fsync", "gpiodetect", "gpiofind", "gpioget", "gpioinfo", "gpioset", "groups",
    "halt", "hostid", "hostname", "hwclock", "i2cdetect", "i2cdump", "i2cget",
    "i2cset", "i2ctransfer", "id", "inotifyd", "insmod", "linux32", "logger",
    "login", "logname", "losetup", "lsmod", "lspci", "lsusb", "mkswap", "modinfo",
    "modprobe", "mount", "mountpoint", "nologin", "nproc", "openvt", "partprobe",
    "pivot_root", "poweroff", "printenv", "readahead", "reboot", "rfkill", "rmmod",
    "rtcwake", "shuf", "sleep", "su", "swapoff", "swapon", "sysctl", "tty",
    "ulimit", "umount", "uname", "uptime", "users", "usleep", "vmstat", "w",
    "watch", "who", "whoami",
    # Process utilities
    "chrt", "ionice", "iorenice", "iotop", "kill", "killall", "killall5", "nice",
    "nohup", "nsenter", "pgrep", "pidof", "pkill", "pmap", "prlimit", "ps", "pwdx",
    "renice", "setsid", "taskset", "timeout", "top", "uclampset", "unshare",
    # Network utilities
    "arp", "arping", "brctl", "ether_wake", "ftpget", "ftpput", "host", "httpd",
    "ifconfig", "ifdown", "ifup", "ip", "ipaddr", "ipcalc", "iplink", "ipneigh",
    "iproute", "iprule", "microcom", "nameif", "nbd_client", "nbd_server", "nc",
    "netstat", "nslookup", "ping", "route", "slattach", "sntp", "ss", "telnet",
    "tftp", "traceroute", "tunctl", "vconfig", "wget",
    # Archive utilities
    "bzip2", "compress", "cpio", "gzip", "tar", "unzip", "xz",
    # Misc utilities
    "ascii", "base64", "boolean", "cmp", "count", "diff", "expr",
    "factor", "getconf", "getopt", "hash", "help", "hexdump", "iconv", "mcookie",
    "memeater", "mesg", "mix", "mkpasswd", "pwgen", "readelf", "screen",
    "terminal", "test", "time", "toybox", "ts", "tsort", "unicode", "uudecode",
    "uuencode", "uuidgen", "which",
    # Editors
    "vi", "hexedit",
    # Init system
    "init", "getty", "oneit", "runlevel", "sulogin", "switch_root", "telinit",
    "watchdog",
    # Shell
    "sh",
    # Package manager
    "apk",
]

# Minimal useful set for basic shell use
minimal = ["cat", "echo", "ls", "sh", "boolean", "test"]

